---
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run pre-commit hooks
      run: |
        pre-commit install
        pre-commit run --all-files

    - name: Run flake8
      run: flake8 python/ cli.py

    - name: Check imports with isort
      run: isort --check-only python/ cli.py

    - name: Check formatting with black
      run: black --check python/ cli.py

  test:
    runs-on: macos-latest
    needs: lint

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Test CLI functionality
      run: |
        python cli.py hf-internal-testing/tiny-random-bert --text "CI test" --benchmark

    - name: Test basic functionality
      run: |
        python -c "
        import sys
        sys.path.insert(0, 'python')
        from core import BitInfer
        model = BitInfer('hf-internal-testing/tiny-random-bert')
        result = model.infer('Test')
        print(f'Success: {result.last_hidden_state.shape}')
        "

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e ".[dev]"

    - name: Unit tests
      # tests/ covers the cache dtype regression, where a cached float16 model
      # was silently upcast to float32 on the next run. Reverting that fix fails
      # test_cache_preserves_dtype.
      run: python -m pytest tests/ -v

    - name: Thumbnail is current
      # The banner's language label came from a hand-edited PNG, which is how it
      # ended up saying C++ on a Python package. Regenerate and compare. This
      # only works where Arial is present, which is why it lives in the macOS
      # job and not in the ubuntu lint job; --language is pinned so the check
      # does not depend on the network.
      run: python3 scripts/make_thumbnail.py --check --language Python

    - name: Format and lint checks for tests
      # The pre-commit job runs black/isort/flake8 over python/ and cli.py but
      # not over tests/ or bench.py, so those two are checked here.
      run: |
        python -m black --check tests/ bench.py
        python -m isort --profile black --check-only tests/ bench.py
        python -m flake8 tests/ bench.py

  package:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
