---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: thumbnail-current
        name: thumbnail matches the generated image
        # Regenerate the banner and compare, so the language label cannot drift
        # again. --language is pinned: the hook must not depend on the network.
        entry: python3 scripts/make_thumbnail.py --check --language Python
        language: system
        pass_filenames: false
        files: (\.github/assets/thumbnail\.png|scripts/make_thumbnail\.py)

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]
