[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitinfer"
version = "0.1.0"
description = "Fast quantized inference framework for Apple Silicon"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "harpertoken", email = "harpertoken@icloud.com"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.20.0",
    "accelerate>=0.20.0",
    "numpy>=1.21.0"
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "black>=25.1.0",
    "isort>=5.13.2",
    "flake8>=7.1.1"
]

[project.urls]
Homepage = "https://github.com/harpertoken/bitinfer"
Repository = "https://github.com/harpertoken/bitinfer"
Issues = "https://github.com/harpertoken/bitinfer/issues"

[project.scripts]
bitinfer = "cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
